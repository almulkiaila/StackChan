; Professor Stack-chan, standalone: the robot talks to Gemini Live by itself over Wi-Fi
; (TLS WebSocket), no laptop needed. Flash: run.bat in the folder above.
; The Gemini key comes from the GEMINI_API_KEY environment variable at build time
; (secrets.py) and is never written to the repo.
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:secrets.py   ; config/ (wifi_secrets.h) + the Gemini key from the environment
lib_extra_dirs = ../../../lib     ; StackChanHW (servos, LEDs)
lib_ignore = StackChanLink
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
    ; WebSockets (links2004, 2.6.1, LGPL-2.1) is in lib/ with WEBSOCKETS_MAX_DATA_SIZE raised to 64 KB
    bblanchon/ArduinoJson@7.2.1
