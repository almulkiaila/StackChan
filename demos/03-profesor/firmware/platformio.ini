; Professor Stack-chan: nerdy professor face + Gemini Live voice (based on demo 02.1).
; Easiest: demos/03-profesor/run.bat (builds, flashes and starts the relay).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; audio.cpp/.h: copied from demo 02 (mic and speaker over UDP).
extra_scripts = pre:config_path.py   ; adds config/ (wifi_secrets.h) to the include path
lib_extra_dirs = ../../../lib     ; StackChanHW (servos, LEDs, camera) and StackChanLink (UDP with the laptop)
lib_deps =
    StackChanHW
    StackChanLink
    m5stack/M5Unified@0.2.21
